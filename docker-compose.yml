services:
  frontend:
    image: personal_management-frontend-${BUILD_TARGET:-dev}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: ${BUILD_TARGET:-dev}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_CONTAINER_PORT:-5173}"
    env_file:
      - .env
    # Bind mounts below are only meaningful for the dev target (hot reload).
    # They're harmless no-ops for the production target: that stage is
    # nginx serving a pre-built /usr/share/nginx/html, not /app.
    volumes:
      - ./frontend:/app
      - /app/node_modules

  # backend: none by design (see adr/0009-no-backend-privacy-first.md).
  # Left here only in case a private-storage sync service is ever needed.
  # backend:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   ports:
  #     - "${BACKEND_PORT}:${BACKEND_PORT}"
  #   env_file:
  #     - .env
  #   volumes:
  #     - ./backend:/app
